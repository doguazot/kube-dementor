<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kube-Dementor — Attack Graph Dashboard</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3346;
  --text: #e2e8f0;
  --text-muted: #8892b0;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --red: #ef4444;
  --orange: #f59e0b;
  --green: #22c55e;
  --cyan: #06b6d4;
  --pink: #ec4899;
  --purple: #a855f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

 
.app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 52px 1fr; height: 100vh; }
.topbar { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 10; }
.topbar h1 { font-size: 15px; font-weight: 700; }
.topbar h1 span { color: var(--accent); }
.topbar .stats { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); }
.topbar .stats .stat-val { color: var(--text); font-weight: 600; }

.sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
.sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; }
.sidebar .section { margin-bottom: 20px; }

.nav-btn { width: 100%; padding: 8px 10px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; cursor: pointer; text-align: left; margin-bottom: 4px; transition: all .15s; display: flex; align-items: center; gap: 6px; }
.nav-btn:hover { background: var(--surface2); border-color: var(--accent); }
.nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.nav-btn .badge { margin-left: auto; background: var(--surface2); padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
.nav-btn.active .badge { background: rgba(255,255,255,.2); }

.main { overflow: hidden; position: relative; }
.view { display: none; height: 100%; flex-direction: column; }
.view.active { display: flex; }

 
#graph-canvas { flex: 1; cursor: grab; }
#graph-canvas:active { cursor: grabbing; }

 
.table-view { flex: 1; overflow: auto; padding: 20px; }
.table-view h3 { font-size: 18px; margin-bottom: 4px; }
.table-view .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; background: var(--surface); color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--surface2); }

.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.tag-red { background: rgba(239,68,68,.15); color: var(--red); }
.tag-orange { background: rgba(245,158,11,.15); color: var(--orange); }
.tag-green { background: rgba(34,197,94,.15); color: var(--green); }
.tag-cyan { background: rgba(6,182,212,.15); color: var(--cyan); }
.tag-pink { background: rgba(236,72,153,.15); color: var(--pink); }
.tag-purple { background: rgba(168,85,247,.15); color: var(--purple); }
.tag-accent { background: rgba(99,102,241,.15); color: var(--accent); }

 
.loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 14px; }
.loading::before { content: ''; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

 
.detail-panel { position: absolute; top: 0; right: 0; width: 380px; height: 100%; background: var(--surface); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; z-index: 5; transform: translateX(100%); transition: transform .2s; }
.detail-panel.open { transform: translateX(0); }
.detail-panel h3 { font-size: 15px; margin-bottom: 12px; }
.detail-panel .close-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; }
.detail-panel .field { margin-bottom: 10px; }
.detail-panel .field-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.detail-panel .field-value { font-size: 13px; margin-top: 2px; word-break: break-all; }

 
.legend { position: absolute; bottom: 12px; left: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 11px; z-index: 5; }
.legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

 
.finding-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.finding-header { padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background .15s; }
.finding-header:hover { background: var(--surface2); }
.finding-header .arrow { transition: transform .2s; font-size: 10px; color: var(--text-muted); }
.finding-header.open .arrow { transform: rotate(90deg); }
.finding-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
.finding-body.open { display: block; }
.finding-section { margin-top: 10px; }
.finding-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
.finding-text { font-size: 13px; line-height: 1.6; }
.code-block { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; color: #c9d1d9; margin-top: 4px; position: relative; }
.code-block .copy-btn { position: absolute; top: 4px; right: 4px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); padding: 2px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; }
.remediation-box { background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.2); border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.5; margin-top: 4px; }
.impact-box { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.5; margin-top: 4px; }

 
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.stat-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; }
.stat-card .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
.stat-card .desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

 
.chain-search { display: flex; gap: 8px; margin-bottom: 16px; }
.chain-search input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 13px; outline: none; }
.chain-search input:focus { border-color: var(--accent); }
.chain-search button { background: var(--accent); border: none; border-radius: 6px; padding: 8px 16px; color: #fff; font-size: 13px; cursor: pointer; font-weight: 600; }
.chain-node { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; transition: border-color .15s; }
.chain-node:hover { border-color: var(--accent); }

 
.scan-form { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.scan-form label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; margin-top: 10px; }
.scan-form label:first-child { margin-top: 0; }
.scan-form input, .scan-form select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; outline: none; }
.scan-form input:focus { border-color: var(--accent); }
.scan-form .btn-scan { margin-top: 14px; width: 100%; background: var(--green); border: none; border-radius: 6px; padding: 10px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.scan-form .btn-scan:hover { opacity: .9; }
.scan-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }

 
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
   
  <div class="topbar">
    <h1>Kube<span>Hound</span></h1>
    <div class="stats">
      <div>Nodes: <span class="stat-val" id="stat-nodes">-</span></div>
      <div>Edges: <span class="stat-val" id="stat-edges">-</span></div>
    </div>
  </div>

   
  <div class="sidebar">
    <div class="section">
      <h2>Dashboard</h2>
      <button class="nav-btn active" data-view="overview" onclick="switchView('overview')">Overview</button>
      <button class="nav-btn" data-view="chain" onclick="switchView('chain')">Attack Chains</button>
      <button class="nav-btn" data-view="graph" onclick="switchView('graph')">Attack Graph</button>
    </div>
    <div class="section">
      <h2>Findings</h2>
      <button class="nav-btn" data-view="escapes" onclick="switchView('escapes')">Container Escapes <span class="badge" id="badge-escapes">-</span></button>
      <button class="nav-btn" data-view="paths" onclick="switchView('paths')">Role Bindings <span class="badge" id="badge-paths">-</span></button>
      <button class="nav-btn" data-view="exec" onclick="switchView('exec')">Pod Exec <span class="badge" id="badge-exec">-</span></button>
      <button class="nav-btn" data-view="tokens" onclick="switchView('tokens')">Token Steal <span class="badge" id="badge-tokens">-</span></button>
      <button class="nav-btn" data-view="impersonate" onclick="switchView('impersonate')">Impersonation <span class="badge" id="badge-impersonate">-</span></button>
      <button class="nav-btn" data-view="critical" onclick="switchView('critical')">Critical Assets <span class="badge" id="badge-critical">-</span></button>
    </div>
    <div class="section">
      <h2>Management</h2>
      <button class="nav-btn" data-view="scans" onclick="switchView('scans')">Scan History</button>
    </div>
    <div class="section">
      <h2>Custom Query</h2>
      <textarea id="cypher-input" rows="3" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:11px;font-family:monospace;resize:vertical;" placeholder="MATCH (n)-[r]->(m) RETURN n,r,m LIMIT 50"></textarea>
      <button class="nav-btn" onclick="runCustomQuery()" style="margin-top:4px;justify-content:center;">Run Query</button>
    </div>
  </div>

   
  <div class="main">
    <div class="view active" id="view-overview"><div class="table-view" id="overview-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-chain"><div class="table-view" id="chain-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-graph">
      <canvas id="graph-canvas"></canvas>
      <div class="legend" id="graph-legend"></div>
      <div class="detail-panel" id="detail-panel">
        <button class="close-btn" onclick="closeDetail()">&#x2715;</button>
        <div id="detail-content"></div>
      </div>
    </div>
    <div class="view" id="view-critical"><div class="table-view" id="critical-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-escapes"><div class="table-view" id="escapes-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-paths"><div class="table-view" id="paths-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-exec"><div class="table-view" id="exec-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-tokens"><div class="table-view" id="tokens-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-impersonate"><div class="table-view" id="impersonate-content"><div class="loading">Loading...</div></div></div>
    <div class="view" id="view-scans"><div class="table-view" id="scans-content"><div class="loading">Loading...</div></div></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
